plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.mewatitune.player"
    compileSdk = 36
    ndkVersion = "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.mewatitune.player"
        minSdk = 21
        targetSdk = 36
        versionCode = 1
        versionName = "1.0.0"
    }

    signingConfigs {
        release {
            // Load keystore properties from local file (not committed to VCS).
            // A release build must NEVER silently fall back to the debug
            // keystore — if key.properties is missing, fail loudly instead.
            def keystorePropertiesFile = rootProject.file("key.properties")
            if (keystorePropertiesFile.exists()) {
                def keystoreProperties = new Properties()
                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

// Fail the build (instead of silently signing with the debug keystore) if a
// release/bundleRelease task is requested without android/key.properties present.
gradle.taskGraph.whenReady { taskGraph ->
    def requestingRelease = taskGraph.allTasks.any { task ->
        task.name.toLowerCase().contains("release")
    }
    if (requestingRelease && !rootProject.file("key.properties").exists()) {
        throw new GradleException(
            "Missing android/key.properties. Release builds must be signed with the " +
            "real release keystore — refusing to fall back to the debug keystore. " +
            "Create key.properties with storeFile/storePassword/keyAlias/keyPassword " +
            "before building a release APK/AAB."
        )
    }
}

flutter {
    source = "../.."
}
