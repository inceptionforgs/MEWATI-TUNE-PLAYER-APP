name: mewati_tune_player
description: "Mewati Tune Player - Mewati music ka ghar. A regional folk music streaming app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.1
  supabase_flutter: ^2.5.0
  flutter_dotenv: ^5.1.0

  just_audio: ^0.9.46
  just_audio_background: ^0.0.1-beta.17

  background_downloader: ^9.5.9

  path_provider: ^2.1.2
  shared_preferences: ^2.2.2
  cached_network_image: ^3.3.1
  intl: ^0.19.0
  http: ^1.2.0

  sentry_flutter: ^9.27.0
  connectivity_plus: ^5.0.2

  # For Android 13+ notification permission
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  fake_async: ^1.3.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/